name: CI — Build, Push, Deploy

# Deploys marn-agency-dashboard to ECS Fargate in the marn-dev account.
#
# AWS auth is via GitHub OIDC — no long-lived keys. The IAM role trust policy
# keys on the GitHub *Environment* claim
# (repo:MarnOfficial/marn-agency-dashboard:environment:dev), NOT the branch, so
# this works from prod/main/master alike. The environment: key below is what
# puts that claim in the token, so it must be present.
#
# Required in the `dev` GitHub Environment:
#   secrets: AWS_ROLE_ARN
#            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
#   vars:    AWS_REGION, ECR_REPOSITORY, ECS_CLUSTER, ECS_SERVICE,
#            NEXT_PUBLIC_API_URL, NEXT_PUBLIC_APP_URL
# The AWS ones are emitted by `terraform output dashboard_deploy_config`.
#
# NOTE ON NEXT_PUBLIC_*: these are build-time only. Next.js inlines them into
# the client bundle during `next build`, so they are passed as Docker build args
# here rather than as ECS task environment variables. Changing one requires a
# rebuild, not just a service restart.

on:
  push:
    branches:
      - prod
      - main
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: dev
        type: choice
        options:
          - dev

concurrency:
  group: ci-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve environment
        run: |
          echo "DEPLOY_ENV=${{ github.event.inputs.environment || 'dev' }}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.DEPLOY_ENV }}-${{ env.SHORT_SHA }}
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.DEPLOY_ENV }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --force-new-deployment \
            --region  "${{ vars.AWS_REGION }}" \
            --no-cli-pager

      - name: Wait for ECS stability
        run: |
          aws ecs wait services-stable \
            --cluster  "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}" \
            --region   "${{ vars.AWS_REGION }}" \
            --no-cli-pager
